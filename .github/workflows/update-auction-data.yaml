name: Update Auction Data

# Workflow disabled - manual trigger only
# Uncomment schedule section to re-enable hourly runs
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

# Required permissions
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Scrape auction data
      run: cd packages/stats && bun run scrape-to-file.ts

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add packages/stats/auction-data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update auction data [skip ci]" && git push)
